<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CineHD Embed</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #player {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }
      #status {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        background: #0a0a0a;
      }
      #status.hidden {
        display: none;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #333;
        border-top-color: #e50914;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .error {
        color: #ff6b6b;
        max-width: 520px;
        line-height: 1.5;
      }
      .hint {
        color: #888;
        font-size: 13px;
        max-width: 560px;
        line-height: 1.6;
      }
      .hint code {
        background: #1a1a1a;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
      }
      .servers {
        margin-top: 8px;
        max-height: 180px;
        overflow: auto;
        font-size: 12px;
        color: #aaa;
        columns: 2;
        gap: 16px;
        text-align: left;
      }
      @media (max-width: 480px) {
        .servers {
          columns: 1;
        }
      }
    </style>
  </head>
  <body>
    <iframe id="player" title="Video player" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
    <div id="status">
      <div class="spinner" id="loader"></div>
      <p id="message">Loading…</p>
      <p class="hint" id="hint"></p>
      <div class="servers" id="servers"></div>
    </div>

    <script src="provider.js"></script>
    <script>
      (function () {
        const params = new URLSearchParams(location.search);

        const type = params.get("type");
        const id = params.get("id");
        const season = params.get("season");
        const episode = params.get("episode");
        const server = params.get("server");

        const iframe = document.getElementById("player");
        const status = document.getElementById("status");
        const message = document.getElementById("message");
        const hint = document.getElementById("hint");
        const loader = document.getElementById("loader");
        const serversEl = document.getElementById("servers");

        function showError(text, help) {
          loader.style.display = "none";
          message.className = "error";
          message.textContent = text;
          hint.innerHTML = help || "";
          iframe.style.display = "none";
          status.classList.remove("hidden");

          const names = window.listProviders().map((p) => p.name);
          serversEl.textContent = "Available servers: " + names.join(", ");
        }

        function showPlayer(url) {
          iframe.src = url;
          iframe.style.display = "block";
          status.classList.add("hidden");
        }

        /* JSON list mode: ?list=1 */
        if (params.get("list") === "1") {
          document.body.innerHTML =
            "<pre style='padding:16px;background:#111;color:#eee;min-height:100vh;margin:0'>" +
            JSON.stringify(window.listProviders(), null, 2) +
            "</pre>";
          return;
        }

        /* Help when opened with no params */
        if (!type && !id && !server) {
          showError(
            "CineHD Embed Proxy",
            "Movie: <code>?type=movie&id=550&server=Vidpro</code><br>" +
              "TV: <code>?type=tv&id=1399&season=1&episode=1&server=Vidpro</code><br><br>" +
              "Opens redirect to provider automatically. Add <code>?embed=1</code> to use iframe instead.<br>" +
              "Use TMDB or IMDB id depending on server (see <code>?list=1</code>)."
          );
          return;
        }

        const result = window.buildEmbedUrl({ type, id, season, episode, server });

        if (result.error) {
          showError(result.error, "Check params and try again.");
          return;
        }

        /* Default: auto-forward to the real provider URL */
        if (params.get("embed") !== "1") {
          location.replace(result.url);
          return;
        }

        /* Optional iframe mode: ?embed=1 */
        showPlayer(result.url);
      })();
    </script>
  </body>
</html>
